name: travel_planner
services:
  postgres:
    image: postgres:15-alpine
    container_name: travel_planner_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME_PROD:-travel_planner_prod}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:

      - "5433:5432"
    networks:
      - travel_planner_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel_planner_api
    restart: unless-stopped
    environment:
      SERVER_PORT: 4567

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME_PROD:-travel_planner_prod}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-pass}
    ports:
      - "4568:4567"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - travel_planner_network
    volumes:
      - app_logs:/app/logs
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  postgres_data:
  app_logs:

networks:
  travel_planner_network:
    driver: bridge
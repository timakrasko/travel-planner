<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .hover-shadow { transition: transform 0.2s, box-shadow 0.2s; }
        .hover-shadow:hover { transform: translateY(-3px); box-shadow: 0 .5rem 1rem rgba(0,0,0,.15)!important; }
        textarea { resize: vertical; }
    </style>
</head>
<body class="bg-light">

<div class="container py-5">
    <header class="text-center mb-5">
        <h1 class="display-4 fw-bold text-primary">✈️ Travel Planner</h1>
        <p class="lead text-muted">Плануйте свої подорожі легко та зручно</p>
    </header>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card shadow-sm border-0 sticky-top" style="top: 20px; z-index: 100;">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0"><i class="bi bi-plus-circle me-2"></i>Нова подорож</h5>
                </div>
                <div class="card-body">
                    <form id="createPlanForm">
                        <div class="mb-3">
                            <label for="title" class="form-label">Назва подорожі *</label>
                            <input type="text" class="form-control" id="title" required placeholder="Наприклад: Відпустка в Парижі">
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Опис</label>
                            <textarea class="form-control" id="description" rows="3" placeholder="Деталі подорожі..."></textarea>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-8">
                                <label for="budget" class="form-label">Бюджет</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="budget" step="0.01" min="0" placeholder="0.00">
                                </div>
                            </div>
                            <div class="col-4">
                                <label for="currency" class="form-label">Валюта</label>
                                <select class="form-select" id="currency">
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                    <option value="UAH">UAH</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="isPublic">
                            <label class="form-check-label" for="isPublic">Публічна подорож</label>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-save me-1"></i> Створити
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="mb-0">Ваші подорожі</h3>
                <span class="badge bg-secondary rounded-pill" id="plansCount">0</span>
            </div>

            <div id="plansContainer" class="row row-cols-1 row-cols-md-2 g-4">
                <div class="col-12 text-center py-5">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Завантаження...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="planModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalPlanTitle">Деталі подорожі</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-4 p-3 bg-light rounded">
                    <h6 class="text-uppercase text-muted small fw-bold">Опис</h6>
                    <p id="modalPlanDescription" class="mb-2">Немає опису</p>
                    <div class="d-flex gap-2">
                        <span class="badge bg-success" id="modalPlanBudget"></span>
                        <span class="badge bg-info" id="modalPlanStatus"></span>
                    </div>
                </div>

                <hr>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0"><i class="bi bi-geo-alt-fill text-danger me-2"></i>Маршрут</h5>
                </div>

                <div id="locationsList" class="list-group mb-4 shadow-sm">
                </div>

                <div class="card bg-light border-0">
                    <div class="card-body">
                        <h6 class="card-title text-primary"><i class="bi bi-plus-circle me-1"></i>Додати нову локацію</h6>
                        <form id="addLocationForm" class="row g-2 align-items-end">
                            <input type="hidden" id="currentPlanId">
                            <div class="col-md-5">
                                <label class="form-label small text-muted mb-1">Назва місця</label>
                                <input type="text" class="form-control form-control-sm" id="locName" required>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small text-muted mb-1">Нотатки</label>
                                <input type="text" class="form-control form-control-sm" id="locNotes">
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary btn-sm w-100">Додати</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="app.js"></script>
</body>
</html>
